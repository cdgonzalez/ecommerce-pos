# version: '3.8'

services:
  redis:
    image: redis:alpine
    container_name: ecommerce-pos-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning

  # Opcional: Contenedor para PostgreSQL en caso de que también quieras usarlo con Docker.
  # Si ya tienes PostgreSQL instalado de manera local, puedes omitir o descomentar este servicio.
  # postgres:
  #   image: postgres:15-alpine
  #   container_name: ecommerce-pos-postgres
  #   environment:
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: postgres
  #     POSTGRES_DB: ecommerce_pos_db
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   restart: unless-stopped

volumes:
  redis_data:
  # postgres_data:
